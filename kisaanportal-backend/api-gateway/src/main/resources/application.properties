server.port=3001
spring.application.name=api-gateway

eureka.client.service-url.defaultZone=http://localhost:8762/eureka/

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://localhost:3002
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.routes[1].id=equipment-service
spring.cloud.gateway.routes[1].uri=http://localhost:3003
spring.cloud.gateway.routes[1].predicates[0]=Path=/equipment/**

spring.cloud.gateway.routes[2].id=booking-service
spring.cloud.gateway.routes[2].uri=http://localhost:3004
spring.cloud.gateway.routes[2].predicates[0]=Path=/booking/**

spring.cloud.gateway.routes[3].id=pricing-service
spring.cloud.gateway.routes[3].uri=http://localhost:3005
spring.cloud.gateway.routes[3].predicates[0]=Path=/pricing/**

spring.cloud.gateway.routes[4].id=review-service
spring.cloud.gateway.routes[4].uri=http://localhost:3006
spring.cloud.gateway.routes[4].predicates[0]=Path=/review/**

spring.cloud.gateway.routes[5].id=analytics-service
spring.cloud.gateway.routes[5].uri=http://localhost:3000
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/analytics/**

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:5173,http://localhost:5174
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true